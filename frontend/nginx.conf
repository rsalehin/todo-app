server {
    listen 8080;
    root /usr/share/nginx/html;
        # Security headers on every response (see 16.2 for what each one does).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # API calls: forward to the backend container and strip the /api prefix
    # (the same job Vite's dev proxy does). "api" is the Compose service name.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One id per request, created here at the front door; the backend logs it (Step 15).
        proxy_set_header X-Request-ID $request_id;
    }

        # Everything else is the React app. A path like /todos is not a file, so nginx
    # serves index.html and React Router shows the right page (reloads work too).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
